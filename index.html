<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SoilTracks</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0c0c;color:#e7e5e4;font-family:Georgia,serif;min-height:100vh}
  .header{background:#111;border-bottom:1px solid #292524;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px}
  .logo{display:flex;align-items:center;gap:10px}.logo-icon{width:38px;height:38px;border-radius:8px;overflow:hidden}
  .logo-text{font-size:18px;font-weight:700;color:#f5f5f4}.logo-sub{font-size:10px;color:#78716c;font-family:monospace}
  .nav{display:flex;gap:2px}.nav-btn{min-height:40px;padding:0 12px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#a8a29e;font-family:sans-serif;white-space:nowrap}.nav-btn.active{background:#4ade8022;color:#4ade80}
  .main{padding:20px 16px;max-width:900px;margin:0 auto}
  .page-title{font-size:22px;font-weight:700;color:#f5f5f4;margin-bottom:4px}
  .page-sub{color:#78716c;font-size:13px;font-family:sans-serif;margin-bottom:18px;line-height:1.5}
  .card{background:#161616;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:16px}
  .sec-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#57534e;margin-bottom:14px;font-family:sans-serif}
  .sub-head{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4ade8077;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #1f1f1f;font-family:sans-serif}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat-card{background:#161616;border:1px solid #222;border-radius:12px;padding:14px}.stat-icon{font-size:22px;margin-bottom:4px}.stat-val{font-size:30px;font-weight:900;color:#4ade80}.stat-label{font-size:11px;color:#78716c;font-family:sans-serif}
  .btn-green{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:sans-serif}
  .btn-outline{background:transparent;border:1px solid #333;border-radius:8px;color:#a8a29e;padding:10px 16px;cursor:pointer;font-size:14px;font-family:sans-serif}
  .btn-danger{background:#7f1d1d33;border:1px solid #f8717133;border-radius:8px;color:#f87171;padding:10px 16px;cursor:pointer;font-size:14px;font-family:sans-serif}
  .btn-full{width:100%;margin-top:10px;padding:15px 0;text-align:center}.btn-sm{padding:8px 14px;font-size:13px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .form-group{margin-bottom:14px}.form-label{font-size:13px;color:#a8a29e;margin-bottom:5px;display:block;font-family:sans-serif;font-weight:600}
  .form-input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px 14px;color:#e7e5e4;font-size:16px;font-family:sans-serif;min-height:46px}.form-input:focus{outline:none;border-color:#4ade8055}
  select.form-input{cursor:pointer}textarea.form-input{min-height:76px;resize:vertical}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .search-bar{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#161616;border:1px solid #222;border-radius:10px;margin-bottom:12px}
  .search-bar input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:#e7e5e4;font-family:sans-serif}
  .cust-row{padding:13px 14px;border-radius:10px;cursor:pointer;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;transition:all .15s}.cust-row:hover{background:#1a1a1a;border-color:#2a2a2a}
  .cust-name{font-weight:700;color:#f5f5f4;font-size:16px}.cust-sub{font-size:12px;color:#78716c;font-family:sans-serif;margin-top:2px}
  .badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;font-family:monospace}
  .b-green{background:#4ade8018;color:#4ade80;border:1px solid #4ade8033}.b-red{background:#f8717118;color:#f87171;border:1px solid #f8717133}.b-orange{background:#fb923c18;color:#fb923c;border:1px solid #fb923c33}.b-gray{color:#57534e}
  .tbl-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:7px 9px;font-weight:600;border-bottom:1px solid #222;font-family:sans-serif;font-size:11px;color:#57534e;text-align:left;white-space:nowrap}th.c{text-align:center;color:#a8a29e;font-family:monospace;font-size:13px}
  td{padding:8px 9px;border-bottom:1px solid #1a1a1a}td.c{text-align:center}
  .sec-row td{padding:10px 9px 4px;color:#4ade8077;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-family:sans-serif;border-bottom:1px solid #1e1e1e;background:#0f0f0f}
  .m-lbl{font-weight:600;color:#d6d3d1;font-family:sans-serif;cursor:pointer;text-decoration:underline dotted #444}.ideal{color:#57534e;font-size:11px;font-family:monospace;white-space:nowrap}
  .scan-opt{display:flex;align-items:center;gap:14px;padding:18px;background:#161616;border:1px solid #222;border-radius:12px;cursor:pointer;margin-bottom:12px}.scan-opt:hover{border-color:#4ade8044}.scan-opt.primary{background:linear-gradient(135deg,#16a34a,#15803d);border-color:#16a34a;color:#fff}
  .scan-opt .si{font-size:30px;flex-shrink:0}.scan-opt .st{font-size:17px;font-weight:700;margin-bottom:2px;font-family:sans-serif}.scan-opt .sd{font-size:13px;opacity:.75;font-family:sans-serif;line-height:1.4}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;justify-content:center}.modal-overlay.open{display:flex}
  .modal{background:#1a1a1a;border:1px solid #333;border-radius:18px 18px 0 0;padding:26px 22px;width:100%;max-width:520px;max-height:75vh;overflow-y:auto}
  .modal h2{font-size:19px;font-weight:700;color:#f5f5f4;margin-bottom:4px}.modal-rng{font-size:13px;color:#4ade80;margin-bottom:14px;font-family:monospace}
  .modal-close{float:right;background:none;border:none;font-size:26px;cursor:pointer;color:#78716c}
  .modal-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4ade80;margin:12px 0 5px;font-family:sans-serif}.modal-body{font-size:14px;line-height:1.65;color:#a8a29e}
  .notif{position:fixed;top:14px;left:10px;right:10px;max-width:480px;margin:0 auto;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:600;z-index:999;box-shadow:0 8px 24px #00000088;font-family:sans-serif;display:none}
  .notif.ok{background:#14532d;border:1px solid #4ade80;color:#bbf7d0}.notif.err{background:#7f1d1d;border:1px solid #f87171;color:#fca5a5}.notif.inf{background:#1e3a5f;border:1px solid #60a5fa;color:#bfdbfe}
  .loading{text-align:center;padding:60px 20px;color:#78716c;font-family:sans-serif}
  .spin{display:inline-block;width:34px;height:34px;border:3px solid #333;border-top-color:#4ade80;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:44px 20px;color:#78716c;font-family:sans-serif}
  .back{display:inline-flex;align-items:center;gap:6px;color:#78716c;font-family:sans-serif;font-size:14px;cursor:pointer;margin-bottom:16px;background:none;border:none;padding:0}
  .banner-ok{background:#0a1f0f;border:1px solid #4ade8033;border-radius:8px;padding:11px 14px;margin-bottom:12px;font-family:sans-serif;font-size:13px;color:#4ade80}
  .photo-preview{max-width:100%;border-radius:10px;margin-top:14px;border:1px solid #333}
  .paste-bar{display:flex;gap:8px;margin-bottom:8px}
  .paste-btn{padding:8px 14px;border-radius:6px;border:1px solid #333;background:#1a1a1a;color:#a8a29e;font-size:13px;font-family:sans-serif;cursor:pointer}
  .paste-btn:hover{border-color:#4ade80;color:#4ade80}
  @media print{.header,.no-print{display:none !important}body{background:#fff}.main{padding:0}}
  @media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}.nav-btn{padding:0 8px;font-size:12px}.logo-sub{display:none}}
</style>
</head>
<body>
<script>var GAS_URL="https://script.google.com/macros/s/AKfycbywck7W0oDiTcvOx5-9z2cs-E7XcyBTGE86ABNu1PqknLB6God_ql5QsGayLH6Zxem8fA/exec";</script>
<div class="notif" id="notif"></div>
<div class="modal-overlay" id="info-modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="info-modal-body"></div></div>
<input type="file" accept="image/*" capture="environment" id="cam-input" style="display:none">
<div class="header">
  <div class="logo">
    <div class="logo-icon"><svg width="38" height="38" viewBox="0 0 38 38" fill="none"><rect width="38" height="38" rx="8" fill="#1a1208"/><path d="M6 28c2-4 5-3 8-5s4-6 7-5 3 4 6 3 5-3 5-3v10H6z" fill="#3d2b1f"/><path d="M6 30c3-2 5-1 8-3s4-4 7-3 3 3 6 2 5-2 5-2v6H6z" fill="#5c3d2e"/><path d="M19 8v12" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="14" cy="13" rx="3" ry="4" fill="#4ade80" opacity=".8" transform="rotate(-20 14 13)"/><ellipse cx="23" cy="14" rx="2.5" ry="3.5" fill="#22c55e" opacity=".7" transform="rotate(15 23 14)"/><ellipse cx="18" cy="9" rx="2" ry="3" fill="#16a34a" opacity=".9" transform="rotate(-5 18 9)"/></svg></div>
    <div><div class="logo-text">SoilTracks</div><div class="logo-sub">Lawns Plants &amp; Pests LLC</div></div>
  </div>
  <div class="nav">
    <button class="nav-btn active" id="nb-dash" onclick="showPage('dash')">Dashboard</button>
    <button class="nav-btn" id="nb-add" onclick="showPage('add')">+ Add</button>
    <button class="nav-btn" id="nb-report" onclick="showPage('report')">Reports</button>
  </div>
</div>
<div class="main" id="app"></div>
<script>
var customers=[],samples=[],activeCust=null,prefill=null;

var TOP_FIELDS=[
  {key:'pH',label:'Soil pH',unit:'',min:6.0,max:7.0,about:'Measures soil acidity or alkalinity on a 0–14 scale. Most lawn grasses thrive between 6.0–7.0 where nutrients are most available.',fix:'If too low (acidic), apply limestone to raise pH. If too high (alkaline), apply elemental sulfur.'},
  {key:'Phosphorus_ppm',label:'Phosphorus',unit:'ppm',min:50,max:100,about:'Supports root development, flowering, and energy transfer. Critical during lawn establishment.',fix:'If deficient, apply phosphate fertilizer (P₂O₅). Avoid excess — high P runs off into waterways.'},
  {key:'Potassium_ppm',label:'Potassium',unit:'ppm',min:100,max:300,about:'Strengthens cell walls, improves drought resistance and winter hardiness.',fix:'If deficient, apply potash (K₂O). Adequate K improves stress and disease tolerance.'}
];
var REC_FIELDS=[
  {key:'LimestoneLbs',label:'Limestone (lb/1000 ft²)',note:'Raises pH. Split if >100 lb. Aerate first.'},
  {key:'RecN',label:'Nitrogen (N)',note:'Split into 2–4 apps through the season.'},
  {key:'RecP',label:'Phosphorus (P₂O₅)',note:'Only apply what the test recommends.'},
  {key:'RecK',label:'Potassium (K₂O)',note:'Important for winter hardiness.'}
];
var LAB_FIELDS=[
  {key:'P_lbA',label:'P (lb/A)',unit:'lb/A',min:50,max:200,about:'Phosphorus measured in pounds per acre from the lab analysis. Different unit than ppm at the top.',fix:'Compare to your ppm reading. If low, apply phosphate fertilizer.'},
  {key:'Acidity',label:'Acidity',unit:'meq/100g',min:0,max:2,about:'Reserve acidity (buffer acidity) in the soil. Higher values mean more limestone is needed to change pH.',fix:'This value determines your limestone application rate. The higher the acidity, the more lime you need.'},
  {key:'K_meq',label:'K',unit:'meq/100g',min:0.15,max:0.40,about:'Potassium measured in milliequivalents — shows how much K is held by the soil. Essential for water regulation.',fix:'If deficient, apply potash (K₂O). Important for disease resistance and winter survival.'},
  {key:'Mg_meq',label:'Mg',unit:'meq/100g',min:0.5,max:2.5,about:'Magnesium is the central atom in every chlorophyll molecule. Plants cannot photosynthesize without it.',fix:'If deficient, apply dolomitic limestone (provides both Ca and Mg) or Epsom salt for a quick boost.'},
  {key:'Ca_meq',label:'Ca',unit:'meq/100g',min:5,max:15,about:'Calcium builds strong cell walls, improves soil structure, and helps neutralize acids. Primary component of limestone.',fix:'If deficient, apply calcitic or dolomitic limestone. Ca and pH are closely linked.'},
  {key:'CEC',label:'CEC',unit:'meq/100g',min:10,max:20,info:true,about:'Cation Exchange Capacity — the soil\'s ability to hold nutrient ions. Higher CEC means fewer fertilizer applications needed. Sandy soils have low CEC; clay soils have high CEC.',fix:'CEC is informational — you can\'t change it quickly. Long-term, adding compost and organic matter increases CEC.'},
  {key:'SatK',label:'K Sat',unit:'%',min:2,max:5,about:'Percentage of CEC occupied by potassium. The ratio between K, Mg, and Ca matters for balanced nutrition.',fix:'If too low, apply potassium. If too high relative to Mg, it can block magnesium uptake — focus on balancing all three.'},
  {key:'SatMg',label:'Mg Sat',unit:'%',min:10,max:20,about:'Percentage of CEC occupied by magnesium. Imbalances between Mg, K, and Ca affect nutrient uptake.',fix:'If deficient, apply dolomitic limestone or Epsom salt. Maintain proper Mg:K ratio.'},
  {key:'SatCa',label:'Ca Sat',unit:'%',min:60,max:80,about:'Percentage of CEC occupied by calcium. Calcium should dominate in healthy soils.',fix:'If deficient, apply limestone. Low Ca saturation usually signals acidic soil needing lime.'}
];
var ALL_METRICS=[].concat(TOP_FIELDS,LAB_FIELDS);

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bdg(m,v){if(!m||m.info||v==null||v==='')return'<span class="b-gray">—</span>';var n=parseFloat(v);if(isNaN(n))return'<span class="b-gray">—</span>';if(n>=m.min&&n<=m.max)return'<span class="badge b-green">'+n+'</span>';if(n>m.max)return'<span class="badge b-orange">'+n+'</span>';return'<span class="badge b-red">'+n+'</span>';}
function setApp(h){document.getElementById('app').innerHTML=h;}
function notify(msg,type,ms){var el=document.getElementById('notif');el.textContent=msg;el.className='notif '+(type||'ok');el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none';},ms||4000);}
function navActive(id){['nb-dash','nb-add','nb-report'].forEach(function(n){var el=document.getElementById(n);if(el)el.classList.remove('active');});var t=document.getElementById('nb-'+id);if(t)t.classList.add('active');}
function gasGet(p){p._cb=Date.now();var qs=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]);}).join('&');return fetch(GAS_URL+'?'+qs,{cache:'no-store'}).then(function(r){return r.json();});}
function gasPost(b){return fetch(GAS_URL,{method:'POST',cache:'no-store',body:JSON.stringify(b)}).then(function(r){return r.json();});}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('cam-input').addEventListener('change',function(e){
    var file=e.target.files[0];if(!file)return;e.target.value='';
    // Check if we're in snap mode (show photo) or scan mode (upload to AI)
    var snapPhoto=document.getElementById('snap-photo');
    if(snapPhoto){
      // Snap & Copy mode — show photo for Live Text
      var reader=new FileReader();reader.onload=function(ev){
        snapPhoto.src=ev.target.result;snapPhoto.style.display='block';
        document.getElementById('snap-step2').style.display='block';
        document.getElementById('snap-step3').style.display='block';
        notify('Photo ready! Tap and hold to use Live Text.','inf',6000);
      };reader.readAsDataURL(file);
    } else {
      // Auto Scan mode — compress and send to server
      doPhotoScan(file);
    }
  });
  loadAndShow();
});

function loadAndShow(){
  setApp('<div class="loading"><div class="spin"></div><p style="margin-top:14px">Loading...</p></div>');
  var t=setTimeout(function(){setApp('<div style="background:#1a0000;border:1px solid #f8717133;border-radius:8px;padding:14px;color:#f87171;font-family:sans-serif">Could not connect.<br><button class="btn-green btn-sm" style="margin-top:10px" onclick="loadAndShow()">↺ Retry</button></div>');},15000);
  gasGet({action:'getData'}).then(function(d){clearTimeout(t);if(!d.success){setApp('<div style="color:#f87171;font-family:sans-serif">'+esc(d.error)+'</div>');return;}customers=(d.customers||[]).sort(function(a,b){return(a.Name||'').localeCompare(b.Name||'');});samples=d.samples||[];showPage('dash');}).catch(function(err){clearTimeout(t);setApp('<div style="color:#f87171;font-family:sans-serif">'+esc(err.message)+'<br><button class="btn-green btn-sm" style="margin-top:10px" onclick="loadAndShow()">↺ Retry</button></div>');});
}
function showPage(p){navActive(p);if(p==='dash'){activeCust=null;renderDash();}else if(p==='add'){activeCust=null;prefill=null;renderScan();}else if(p==='report')renderReportPage();}

// ── Dashboard ──
function renderDash(){
  var yrs={};samples.forEach(function(s){if(s.Year)yrs[s.Year]=true;});
  var html='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px"><div class="page-title">Soil Data Overview</div><button class="btn-outline btn-sm no-print" onclick="refreshData()" title="Reload from Google Sheets">↺ Refresh</button></div>';
  html+='<div class="page-sub">'+customers.filter(function(c){return!c.Archived;}).length+' active customers · '+samples.length+' samples · '+Object.keys(yrs).length+' seasons</div>';
  html+='<div class="stats-grid"><div class="stat-card"><div class="stat-icon">👨‍🌾</div><div class="stat-val">'+customers.filter(function(c){return!c.Archived;}).length+'</div><div class="stat-label">Active Customers</div></div><div class="stat-card"><div class="stat-icon">🧪</div><div class="stat-val">'+samples.length+'</div><div class="stat-label">Samples</div></div><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">'+Object.keys(yrs).length+'</div><div class="stat-label">Seasons</div></div></div>';
  html+='<div class="card no-print"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="sec-title" style="margin:0">Customers</div><button class="btn-green btn-sm" onclick="toggleAddCust()">+ Add Customer</button></div>';
  html+='<div id="add-cust-panel" style="display:none;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:16px;margin-bottom:14px">';
  html+='<div style="font-size:13px;font-weight:700;color:#4ade80;margin-bottom:10px;font-family:sans-serif">New Customer</div>';
  html+='<div style="font-size:12px;color:#78716c;font-family:sans-serif;margin-bottom:10px;line-height:1.5">Enter the name now — they\'ll be added to the sheet when you save their first soil sample.</div>';
  html+='<div style="display:flex;gap:8px;align-items:center"><input class="form-input" id="new-cust-name" placeholder="Customer name..." style="flex:1;min-height:40px;font-size:14px" onkeydown="if(event.key===\'Enter\')doAddCust()"><button class="btn-green btn-sm" onclick="doAddCust()">Add</button><button class="btn-outline btn-sm" onclick="toggleAddCust()">Cancel</button></div>';
  html+='</div>';
  html+='<div class="search-bar"><span style="color:#57534e">🔍</span><input id="csearch" placeholder="Search..." oninput="filterCust()"></div>';
  html+='<div id="clist">'+buildCL(customers)+'</div>';
  // Archived section
  var archived=customers.filter(function(c){return c.Archived;});
  if(archived.length){html+='<div style="margin-top:16px"><div class="sec-title" style="cursor:pointer" onclick="toggleArchived()">📦 Archived ('+archived.length+') <span id="arch-arrow">▼</span></div><div id="arch-list" style="display:none">'+buildCL(archived,true)+'</div></div>';}
  html+='</div>';
  setApp(html);
}

function toggleArchived(){
  var el=document.getElementById('arch-list'),ar=document.getElementById('arch-arrow');
  if(!el)return;
  var open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  if(ar)ar.textContent=open?'▼':'▲';
}

function toggleAddCust(){
  var p=document.getElementById('add-cust-panel');if(!p)return;
  var open=p.style.display!=='none';
  p.style.display=open?'none':'block';
  if(!open){setTimeout(function(){var el=document.getElementById('new-cust-name');if(el)el.focus();},50);}
}

function doAddCust(){
  var inp=document.getElementById('new-cust-name');if(!inp)return;
  var name=inp.value.trim();
  if(!name){notify('Enter a customer name.','err');return;}
  // Check duplicate
  var dupe=customers.find(function(c){return(c.Name||'').toLowerCase()===name.toLowerCase();});
  if(dupe){notify('"'+name+'" is already in the list.','err');return;}
  // Add locally — will be written to sheet on first sample save
  var newCust={Name:name,_pending:true};
  customers.push(newCust);
  customers.sort(function(a,b){return(a.Name||'').localeCompare(b.Name||'');});
  notify('✅ "'+name+'" added — open them to enter a sample.','ok');
  activeCust=newCust;
  openCust(name);
}

function refreshData(){
  notify('Reloading from Google Sheets...','inf',3000);
  loadAndShow();
}

function buildCL(list,isArchived){
  var active=isArchived?list:list.filter(function(c){return!c.Archived;});
  if(!active.length)return'<div class="empty"><div style="font-size:40px;margin-bottom:10px">🌱</div><div style="font-size:15px;font-weight:700;color:#f5f5f4">No customers</div></div>';
  return active.map(function(c){
    var cs=samples.filter(function(s){return s.CustomerName===c.Name;});
    var yrs=[...new Set(cs.map(function(s){return s.Year;}).filter(Boolean))].sort().join(', ');

function inlineRename(oldName){
  var newName=prompt('Rename "'+oldName+'" to:',oldName);
  if(!newName||newName.trim()===''||newName.trim()===oldName)return;
  newName=newName.trim();
  var dupe=customers.find(function(c){return(c.Name||'').toLowerCase()===newName.toLowerCase()&&c.Name!==oldName;});
  if(dupe){notify('"'+newName+'" already exists.','err');return;}
  gasPost({action:'renameCustomer',oldName:oldName,newName:newName}).then(function(r){
    if(!r.success){notify('Rename failed: '+(r.error||''),'err');return;}
    // Update local data
    customers.forEach(function(c){if(c.Name===oldName)c.Name=newName;});
    samples.forEach(function(s){if(s.CustomerName===oldName)s.CustomerName=newName;});
    customers.sort(function(a,b){return(a.Name||'').localeCompare(b.Name||'');});
    notify('✅ Renamed to "'+newName+'"');
    renderDash();
  }).catch(function(e){notify('Error: '+e.message,'err');});
}

function doArchive(name,archive){
  var verb=archive?'Archive':'Restore';
  if(!confirm(verb+' "'+name+'"?'))return;
  gasPost({action:'archiveCustomer',name:name,archived:archive}).then(function(r){
    if(!r.success){notify('Error: '+(r.error||''),'err');return;}
    var c=customers.find(function(x){return x.Name===name;});
    if(c)c.Archived=archive;
    notify(archive?'📦 Archived "'+name+'"':'♻️ Restored "'+name+'"');
    renderDash();
  }).catch(function(e){notify('Error: '+e.message,'err');});
}

function compressForScan(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var MAX=1200;var w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.7).split(',')[1]);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function doSave(){
  var year=parseInt((document.getElementById('sf-Year')||{}).value,10);if(!year||year<1990){notify('Enter a valid year.','err');return;}
  // Resolve customer — activeCust set by sfCustInput, or from text field for new customers
  if(!activeCust){
    var custInput=document.getElementById('sf-cust');
    var custVal=custInput?custInput.value.trim():'';
    if(custVal){
      // Check again in case they typed an exact match without triggering onchange
      var exact=customers.find(function(c){return(c.Name||'').toLowerCase()===custVal.toLowerCase();});
      if(exact){activeCust=exact;}
      else{
        // New customer — add locally and will be auto-created via saveSample on server
        if(!confirm('Create new customer "'+custVal+'"?'))return;
        var newCust={Name:custVal,_pending:true};
        customers.push(newCust);
        customers.sort(function(a,b){return(a.Name||'').localeCompare(b.Name||'');});
        activeCust=newCust;
      }
    }
  }
  if(!activeCust){notify('Enter a customer name.','err');return;}
  var data={CustomerName:activeCust.Name,Field:activeCust.Field||'',Year:year};
  TOP_FIELDS.concat(LAB_FIELDS).forEach(function(m){var v=((document.getElementById('sf-'+m.key)||{}).value||'').trim();if(v!=='')data[m.key]=parseFloat(v);});

        improvedStillHigh:'Calcium remains elevated. This is usually not a problem but watch pH.',
        declinedFromOptimal:'Calcium has dropped below optimal — often linked to acidic conditions. Limestone helps.',
        declinedFurtherLow:'Low calcium is weakening soil structure. Limestone is the primary fix.',
        declinedFurtherHigh:'Calcium remains high. Monitor pH — high Ca can push pH above optimal.',
        stableOptimal:'Calcium is holding steady in the ideal range.',
        stableOffTarget:'Calcium is stable but outside the target. Address with limestone per recommendations.',
        infoOnly:''
      },
      CEC:{
        improvedToOptimal:'',improvedStillLow:'',improvedStillHigh:'',
        declinedFromOptimal:'',declinedFurtherLow:'',declinedFurtherHigh:'',
        stableOptimal:'',stableOffTarget:'',
        infoOnly:'CEC is a long-term property of your soil. Adding compost and organic matter over many seasons will gradually improve it.'
      },
      SatK:{
        improvedToOptimal:'Potassium saturation is now in the ideal range — good balance with Mg and Ca.',
        improvedStillLow:'K saturation is rising. Continue potash applications.',
        improvedStillHigh:'K saturation remains high. Excess K can block magnesium uptake — hold off on additional potash.',
        declinedFromOptimal:'K saturation has dropped below optimal. A potash application is recommended.',
        declinedFurtherLow:'Low K saturation limits drought resistance. Apply K₂O.',
        declinedFurtherHigh:'K saturation is still high. Skip additional potash and watch Mg levels.',
        stableOptimal:'Potassium saturation is steady in the ideal range.',
        stableOffTarget:'K saturation is stable but off-target. Adjust per recommendations.',
        infoOnly:''
      },
      SatMg:{
        improvedToOptimal:'Magnesium saturation is now in the ideal range.',
        improvedStillLow:'Mg saturation is rising — continue dolomitic limestone or Epsom salt.',
        improvedStillHigh:'Mg saturation remains elevated. Avoid additional Mg sources.',
        declinedFromOptimal:'Mg saturation has slipped below optimal — consider dolomitic limestone.',
        declinedFurtherLow:'Low Mg saturation is limiting photosynthesis. Dolomitic limestone or Epsom salt recommended.',
        declinedFurtherHigh:'Mg saturation is still high. No additional magnesium needed.',
        stableOptimal:'Magnesium saturation is holding steady in the ideal range.',
        stableOffTarget:'Mg saturation is stable but off-target. Adjust per recommendations.',
        infoOnly:''
      },
      SatCa:{
        improvedToOptimal:'Calcium saturation is now in the ideal range — healthy soil base.',
        improvedStillLow:'Ca saturation is rising. Limestone applications are helping.',
        improvedStillHigh:'Ca saturation remains high. Monitor pH to ensure it doesn\'t push above 7.0.',
        declinedFromOptimal:'Ca saturation has dropped. This often signals acidifying conditions — check limestone schedule.',
        declinedFurtherLow:'Ca saturation is low, usually a sign of acidic soil. Limestone is the primary fix.',
        declinedFurtherHigh:'Ca saturation is still above optimal. Watch pH closely.',
        stableOptimal:'Calcium saturation is steady in the ideal range.',
        stableOffTarget:'Ca saturation is stable but off-target. Limestone or pH correction recommended.',
        infoOnly:''
      }
    };

    function getNoteKey(m, pv, cv){
      if(m.info) return 'infoOnly';
      var prevOk=pv>=m.min&&pv<=m.max, currOk=cv>=m.min&&cv<=m.max;
      var prevLow=pv<m.min, currLow=cv<m.min;
      var improved=cv>pv, declined=cv<pv;
      if(prevOk&&currOk) return 'stableOptimal';
      if(!prevOk&&!currOk&&Math.abs(cv-pv)<0.01) return 'stableOffTarget';
      if(!prevOk&&!currOk&&improved&&currLow) return 'improvedStillLow';
      if(!prevOk&&!currOk&&improved&&!currLow) return 'improvedStillHigh';
      if(!prevOk&&currOk) return 'improvedToOptimal';
      if(prevOk&&!currOk&&currLow) return 'declinedFromOptimal';
      if(!prevOk&&!currOk&&declined&&currLow) return 'declinedFurtherLow';
      if(!prevOk&&!currOk&&declined&&!currLow) return 'declinedFurtherHigh';
      if(prevOk&&!currOk&&!currLow) return 'declinedFromOptimal';
      return 'stableOffTarget';
    }

    var changeItems=[];
    ALL_METRICS.forEach(function(m){
      var pv=parseFloat(prev[m.key]), cv=parseFloat(curr[m.key]);
      if(isNaN(pv)||isNaN(cv)) return;
      var diff=cv-pv;
      var absDiff=Math.abs(diff);
      if(absDiff<0.001) return; // skip if no meaningful change
      var arrow=diff>0?'▲':'▼';
      var arrowClr=diff>0?'#16a34a':'#dc2626';
      // For informational fields (CEC) direction doesn't carry good/bad meaning
      if(m.info){arrowClr='#888';}
      var noteKey=getNoteKey(m,pv,cv);
      var noteBank=changeNotes[m.key]||{};
      var note=noteBank[noteKey]||'';
      // Format diff nicely
      var diffStr=(diff>0?'+':'')+Math.round(diff*100)/100;
      changeItems.push({m:m,pv:pv,cv:cv,diff:diff,diffStr:diffStr,arrow:arrow,arrowClr:arrowClr,note:note,noteKey:noteKey});
    });

    if(changeItems.length){
      h+='<div style="font-size:13px;font-weight:800;color:#2d5a1b;text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px;border-bottom:2px solid #2d5a1b;padding-bottom:6px">What Changed Since Last Year</div>';
      h+='<div style="font-size:11px;color:#666;margin-bottom:12px">Comparing '+prevYr+' → '+currYr+' results. Only metrics with measured changes are shown.</div>';
      h+='<div style="display:flex;flex-direction:column;gap:8px">';
      changeItems.forEach(function(item){
        var currOk=item.cv>=item.m.min&&item.cv<=item.m.max;
        var borderClr=item.m.info?'#bbb':(currOk?'#16a34a':(item.cv<item.m.min?'#dc2626':'#d97706'));
        h+='<div style="padding:11px 14px;border-radius:8px;border-left:4px solid '+borderClr+';background:#fafafa;border:1px solid #eee;border-left-width:4px">';
        h+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px">';
        h+='<div style="font-weight:700;font-size:13px;color:#1a1a1a">'+item.m.label+(item.m.unit?' ('+item.m.unit+')':'')+'</div>';
        h+='<div style="font-size:13px;font-family:monospace;font-weight:700">'
          +'<span style="color:#888">'+item.pv+'</span>'
          +' <span style="color:'+item.arrowClr+'">'+item.arrow+' '+item.diffStr+'</span>'
          +' <span style="color:'+borderClr+'">→ '+item.cv+'</span>'
          +'</div>';
        h+='</div>';
        if(item.note){
          h+='<div style="font-size:11px;color:#444;margin-top:5px;line-height:1.6">'+item.note+'</div>';
        }
        h+='</div>';
      });
      h+='</div>';
    }
  }

  // ── Next Steps ──
  h+='<div style="background:#f0f7ee;border-radius:8px;padding:16px;margin-top:20px">'
    +'<div style="font-weight:700;color:#2d5a1b;margin-bottom:6px;font-size:13px">Recommended Next Steps</div>'
    +'<div style="font-size:12px;color:#555;line-height:1.7">'
    +'• Follow the improvement plan recommendations above<br>'
    +'• Retest soil in 2–3 years to track progress<br>'
    +'• Apply treatments at recommended rates — more is not better<br>'
    +'• Aerate before limestone application for best results<br>'
    +'• Split nitrogen applications through the growing season<br>'
    +'• Contact us with questions about your soil improvement plan'
    +'</div></div>';

  // ── Footer ──
  h+='<div style="margin-top:20px;padding-top:14px;border-top:2px solid #2d5a1b;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    +'<div><div style="font-weight:900;color:#2d5a1b;font-size:14px">Lawns Plants &amp; Pests LLC</div><div style="font-size:10px;color:#888">3506 High St · Harrisburg, PA 17109 · 717-379-3248</div></div>'
    +'<div style="text-align:right;font-size:9px;color:#aaa">Report generated by SoilTracks<br>Data source: Penn State Extension Soil Test<br>🟢 Optimal 🟠 Above 🔴 Below</div>'
    +'</div></div>';

  out.innerHTML=h;
}
</script>

</html>
