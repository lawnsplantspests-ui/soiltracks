<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SoilTracks - Lawns Plants &amp; Pests</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c0c0c; color: #e7e5e4; font-family: Georgia, serif; min-height: 100vh; }
  .header { background: #111; border-bottom: 1px solid #292524; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-icon { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .logo-text { font-size: 18px; font-weight: 700; color: #f5f5f4; line-height: 1.1; }
  .logo-sub { font-size: 10px; color: #78716c; font-family: monospace; }
  .nav { display: flex; gap: 2px; }
  .nav-btn { min-height: 40px; padding: 0 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; color: #a8a29e; font-family: sans-serif; white-space: nowrap; }
  .nav-btn.active { background: #4ade8022; color: #4ade80; }
  .main { padding: 20px 16px; max-width: 900px; margin: 0 auto; }
  .page-title { font-size: 22px; font-weight: 700; color: #f5f5f4; margin-bottom: 4px; }
  .page-sub { color: #78716c; font-size: 13px; font-family: sans-serif; margin-bottom: 18px; line-height: 1.5; }
  .card { background: #161616; border: 1px solid #222; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .sec-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #57534e; margin-bottom: 14px; font-family: sans-serif; }
  .sub-head { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #4ade8077; margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #1f1f1f; font-family: sans-serif; }
  .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: #161616; border: 1px solid #222; border-radius: 12px; padding: 14px; }
  .stat-icon { font-size: 22px; margin-bottom: 4px; }
  .stat-val { font-size: 30px; font-weight: 900; color: #4ade80; }
  .stat-label { font-size: 11px; color: #78716c; font-family: sans-serif; }
  .btn-green { background: linear-gradient(135deg,#16a34a,#15803d); color: #fff; border: none; border-radius: 10px; padding: 13px 22px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: sans-serif; }
  .btn-outline { background: transparent; border: 1px solid #333; border-radius: 8px; color: #a8a29e; padding: 10px 16px; cursor: pointer; font-size: 14px; font-family: sans-serif; }
  .btn-danger { background: #7f1d1d33; border: 1px solid #f8717133; border-radius: 8px; color: #f87171; padding: 10px 16px; cursor: pointer; font-size: 14px; font-family: sans-serif; }
  .btn-full { width: 100%; margin-top: 10px; padding: 15px 0; text-align: center; }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: #a8a29e; margin-bottom: 5px; display: block; font-family: sans-serif; font-weight: 600; }
  .form-input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 14px; color: #e7e5e4; font-size: 16px; font-family: sans-serif; min-height: 46px; }
  .form-input:focus { outline: none; border-color: #4ade8055; }
  select.form-input { cursor: pointer; }
  textarea.form-input { min-height: 76px; resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .search-bar { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #161616; border: 1px solid #222; border-radius: 10px; margin-bottom: 12px; }
  .search-bar input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: #e7e5e4; font-family: sans-serif; }
  .cust-row { padding: 13px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: all .15s; }
  .cust-row:hover { background: #1a1a1a; border-color: #2a2a2a; }
  .cust-name { font-weight: 700; color: #f5f5f4; font-size: 16px; }
  .cust-sub { font-size: 12px; color: #78716c; font-family: sans-serif; margin-top: 2px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 12px; font-weight: 700; font-family: monospace; }
  .b-green { background: #4ade8018; color: #4ade80; border: 1px solid #4ade8033; }
  .b-red { background: #f8717118; color: #f87171; border: 1px solid #f8717133; }
  .b-orange { background: #fb923c18; color: #fb923c; border: 1px solid #fb923c33; }
  .b-gray { color: #57534e; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 7px 9px; font-weight: 600; border-bottom: 1px solid #222; font-family: sans-serif; font-size: 11px; color: #57534e; text-align: left; white-space: nowrap; }
  th.c { text-align: center; color: #a8a29e; font-family: monospace; font-size: 13px; }
  td { padding: 8px 9px; border-bottom: 1px solid #1a1a1a; }
  td.c { text-align: center; }
  .sec-row td { padding: 10px 9px 4px; color: #4ade8077; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-family: sans-serif; border-bottom: 1px solid #1e1e1e; background: #0f0f0f; }
  .m-lbl { font-weight: 600; color: #d6d3d1; font-family: sans-serif; cursor: pointer; text-decoration: underline dotted #444; }
  .ideal { color: #57534e; font-size: 11px; font-family: monospace; white-space: nowrap; }
  .scan-opt { display: flex; align-items: center; gap: 14px; padding: 18px; background: #161616; border: 1px solid #222; border-radius: 12px; cursor: pointer; margin-bottom: 12px; }
  .scan-opt:hover { border-color: #4ade8044; }
  .scan-opt.primary { background: linear-gradient(135deg,#16a34a,#15803d); border-color: #16a34a; color: #fff; }
  .scan-opt .si { font-size: 30px; flex-shrink: 0; }
  .scan-opt .st { font-size: 17px; font-weight: 700; margin-bottom: 2px; font-family: sans-serif; }
  .scan-opt .sd { font-size: 13px; opacity: .75; font-family: sans-serif; line-height: 1.4; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 18px 18px 0 0; padding: 26px 22px; width: 100%; max-width: 520px; max-height: 75vh; overflow-y: auto; }
  .modal h2 { font-size: 19px; font-weight: 700; color: #f5f5f4; margin-bottom: 4px; }
  .modal-rng { font-size: 13px; color: #4ade80; margin-bottom: 14px; font-family: monospace; }
  .modal-close { float: right; background: none; border: none; font-size: 26px; cursor: pointer; color: #78716c; }
  .modal-sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #4ade80; margin: 12px 0 5px; font-family: sans-serif; }
  .modal-body { font-size: 14px; line-height: 1.65; color: #a8a29e; }
  .notif { position: fixed; top: 14px; left: 10px; right: 10px; max-width: 480px; margin: 0 auto; border-radius: 10px; padding: 13px 16px; font-size: 14px; font-weight: 600; z-index: 999; box-shadow: 0 8px 24px #00000088; font-family: sans-serif; display: none; }
  .notif.ok { background: #14532d; border: 1px solid #4ade80; color: #bbf7d0; }
  .notif.err { background: #7f1d1d; border: 1px solid #f87171; color: #fca5a5; }
  .notif.inf { background: #1e3a5f; border: 1px solid #60a5fa; color: #bfdbfe; }
  .loading { text-align: center; padding: 60px 20px; color: #78716c; font-family: sans-serif; }
  .spin { display: inline-block; width: 34px; height: 34px; border: 3px solid #333; border-top-color: #4ade80; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 44px 20px; color: #78716c; font-family: sans-serif; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: #78716c; font-family: sans-serif; font-size: 14px; cursor: pointer; margin-bottom: 16px; background: none; border: none; padding: 0; }
  .banner-ok { background: #0a1f0f; border: 1px solid #4ade8033; border-radius: 8px; padding: 11px 14px; margin-bottom: 12px; font-family: sans-serif; font-size: 13px; color: #4ade80; }
  .banner-err { background: #1a0000; border: 1px solid #f8717133; border-radius: 8px; padding: 11px 14px; margin-bottom: 12px; font-family: sans-serif; font-size: 13px; color: #f87171; }
  @media print { .header,.no-print { display: none !important; } body { background: #fff; } .main { padding: 0; } }
  @media (max-width:600px) { .stats-grid { grid-template-columns: 1fr 1fr; } .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .nav-btn { padding: 0 8px; font-size: 12px; } .logo-sub { display: none; } }
</style>
</head>
<body>
<script>var GAS_URL="https://script.google.com/macros/s/AKfycbzLu7vowDT_GiVV3ar9gfZUuuSymX76nN67u4tqR6AtSh1wHIpKavfmLXWQ4ge5cR9Cpg/exec";</script>
<div class="notif" id="notif"></div>
<div class="modal-overlay" id="info-modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="info-modal-body"></div></div>
<input type="file" accept="image/*" capture="environment" id="cam-input" style="display:none">
<div class="header">
  <div class="logo">
    <div class="logo-icon"><svg width="38" height="38" viewBox="0 0 38 38" fill="none"><rect width="38" height="38" rx="8" fill="#1a1208"/><path d="M6 28c2-4 5-3 8-5s4-6 7-5 3 4 6 3 5-3 5-3v10H6z" fill="#3d2b1f"/><path d="M6 30c3-2 5-1 8-3s4-4 7-3 3 3 6 2 5-2 5-2v6H6z" fill="#5c3d2e"/><path d="M19 8v12" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/><path d="M19 8c0 0-4 3-5 6" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M19 10c0 0 3 2 4 5" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" fill="none"/><ellipse cx="14" cy="13" rx="3" ry="4" fill="#4ade80" opacity=".8" transform="rotate(-20 14 13)"/><ellipse cx="23" cy="14" rx="2.5" ry="3.5" fill="#22c55e" opacity=".7" transform="rotate(15 23 14)"/><ellipse cx="18" cy="9" rx="2" ry="3" fill="#16a34a" opacity=".9" transform="rotate(-5 18 9)"/></svg></div>
    <div><div class="logo-text">SoilTracks</div><div class="logo-sub">Lawns Plants &amp; Pests LLC</div></div>
  </div>
  <div class="nav">
    <button class="nav-btn active" id="nb-dash" onclick="showPage('dash')">Dashboard</button>
    <button class="nav-btn" id="nb-add" onclick="showPage('add')">+ Add</button>
    <button class="nav-btn" id="nb-report" onclick="showPage('report')">Reports</button>
  </div>
</div>
<div class="main" id="app"></div>
<script>
var customers=[],samples=[],activeCust=null,prefill=null;

var METRICS=[
  {key:'pH',label:'Soil pH',unit:'',min:6.0,max:7.0,sec:'Lab Results',about:'Measures acidity/alkalinity. Best between 6.0–7.0.',fix:'If low, apply limestone. If high, apply sulfur.'},
  {key:'phosphorus',label:'Phosphorus (P)',unit:'lb/A',min:50,max:100,sec:'Lab Results',about:'Drives root development.',fix:'If deficient, apply phosphate fertilizer.'},
  {key:'organicMatter',label:'Organic Matter',unit:'%',min:3,max:6,sec:'Lab Results',about:'Improves water retention and soil biology.',fix:'Top-dress with compost.'},
  {key:'acidity',label:'Buffer Acidity',unit:'meq/100g',min:0,max:2,sec:'Exchangeable Cations',about:'Reserve acidity. Higher = more lime needed.',fix:'Determines limestone rate.'},
  {key:'potassium',label:'Potassium (K)',unit:'meq/100g',min:0.15,max:0.40,sec:'Exchangeable Cations',about:'Water regulation and winter hardiness.',fix:'If deficient, apply potash.'},
  {key:'magnesium',label:'Magnesium (Mg)',unit:'meq/100g',min:0.5,max:2.5,sec:'Exchangeable Cations',about:'Central atom in chlorophyll.',fix:'Apply dolomitic limestone or Epsom salt.'},
  {key:'calcium',label:'Calcium (Ca)',unit:'meq/100g',min:5,max:15,sec:'Exchangeable Cations',about:'Builds cell walls. In limestone.',fix:'Apply limestone.'},
  {key:'cec',label:'CEC',unit:'meq/100g',min:10,max:20,sec:'Exchangeable Cations',info:true,about:'Nutrient holding capacity.',fix:'Informational. Add organic matter.'},
  {key:'satK',label:'K Saturation',unit:'%',min:2,max:5,sec:'% Saturation of CEC',about:'K as % of CEC.',fix:'Balance with Ca and Mg.'},
  {key:'satMg',label:'Mg Saturation',unit:'%',min:10,max:20,sec:'% Saturation of CEC',about:'Mg as % of CEC.',fix:'Apply dolomitic limestone.'},
  {key:'satCa',label:'Ca Saturation',unit:'%',min:60,max:80,sec:'% Saturation of CEC',about:'Ca as % of CEC. Low = acidic.',fix:'Apply limestone.'}
];
var SECTIONS=['Lab Results','Exchangeable Cations','% Saturation of CEC'];
var RECS=[
  {key:'limestoneLbs',label:'Limestone (lb/1000 ft²)',note:'Raises pH. Split if >100 lb.'},
  {key:'recN',label:'Nitrogen (N)',note:'Split into multiple apps.'},
  {key:'recP',label:'Phosphorus (P₂O₅)',note:'Only apply what test recommends.'},
  {key:'recK',label:'Potassium (K₂O)',note:'Important for winter hardiness.'}
];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function statusBadge(m,v){if(m.info||v==null||v==='')return'<span class="b-gray">—</span>';var n=parseFloat(v);if(isNaN(n))return'<span class="b-gray">—</span>';if(n>=m.min&&n<=m.max)return'<span class="badge b-green">'+n+'</span>';if(n>m.max)return'<span class="badge b-orange">'+n+'</span>';return'<span class="badge b-red">'+n+'</span>';}
function setApp(h){document.getElementById('app').innerHTML=h;}
function notify(msg,type,ms){var el=document.getElementById('notif');el.textContent=msg;el.className='notif '+(type||'ok');el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none';},ms||4000);}
function navActive(id){['nb-dash','nb-add','nb-report'].forEach(function(n){var el=document.getElementById(n);if(el)el.classList.remove('active');});var t=document.getElementById('nb-'+id);if(t)t.classList.add('active');}
function gasGet(p){var qs=Object.keys(p).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(p[k]);}).join('&');return fetch(GAS_URL+'?'+qs).then(function(r){return r.json();});}
function gasPost(b){return fetch(GAS_URL,{method:'POST',body:JSON.stringify(b)}).then(function(r){return r.json();});}

window.addEventListener('load',function(){
  document.getElementById('cam-input').addEventListener('change',function(e){e.target.value='';notify('Photo taken! Now use Live Text to copy the text, then paste below.','inf',6000);});
  loadAndShow();
});

function loadAndShow(){
  setApp('<div class="loading"><div class="spin"></div><p style="margin-top:14px">Loading...</p></div>');
  var t=setTimeout(function(){setApp('<div class="banner-err">Could not reach Apps Script.<br><button class="btn-green btn-sm" style="margin-top:10px" onclick="loadAndShow()">↺ Retry</button></div>');},15000);
  gasGet({action:'getData'}).then(function(d){clearTimeout(t);if(!d.success){setApp('<div class="banner-err">Error: '+esc(d.error)+'</div>');return;}customers=d.customers||[];samples=d.samples||[];showPage('dash');}).catch(function(err){clearTimeout(t);setApp('<div class="banner-err">Network error: '+esc(err.message)+'<br><button class="btn-green btn-sm" style="margin-top:10px" onclick="loadAndShow()">↺ Retry</button></div>');});
}

function showPage(page){navActive(page);if(page==='dash'){activeCust=null;renderDashboard();}else if(page==='add'){prefill=null;renderScanStep();}else if(page==='report')renderReportPage();}

// ── Dashboard ──
function renderDashboard(){
  var years={};samples.forEach(function(s){if(s.year)years[s.year]=true;});
  var counts={};samples.forEach(function(s){METRICS.forEach(function(m){if(m.info)return;var n=parseFloat(s[m.key]);if(!isNaN(n)&&(n<m.min||n>m.max))counts[m.key]=(counts[m.key]||0)+1;});});
  var topIssues=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,4);
  var html='<div class="page-title">Soil Data Overview</div><div class="page-sub">'+customers.length+' customers · '+samples.length+' samples · '+Object.keys(years).length+' seasons</div>';
  html+='<div class="stats-grid"><div class="stat-card"><div class="stat-icon">👨‍🌾</div><div class="stat-val">'+customers.length+'</div><div class="stat-label">Customers</div></div><div class="stat-card"><div class="stat-icon">🧪</div><div class="stat-val">'+samples.length+'</div><div class="stat-label">Samples</div></div><div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val">'+Object.keys(years).length+'</div><div class="stat-label">Seasons</div></div></div>';
  if(topIssues.length){html+='<div class="card"><div class="sec-title">Common Issues</div>';topIssues.forEach(function(k){var m=METRICS.find(function(x){return x.key===k;});html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1e1e1e"><span style="font-family:sans-serif;font-size:13px;color:#d6d3d1">'+esc(m?m.label:k)+'</span><span class="badge b-red">'+counts[k]+' out of range</span></div>';});html+='</div>';}
  html+='<div class="card no-print"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="sec-title" style="margin:0">Customers</div></div>';
  html+='<div class="search-bar"><span style="color:#57534e">🔍</span><input id="csearch" placeholder="Search..." oninput="filterCust()"></div>';
  html+='<div id="clist">'+buildCustList(customers)+'</div></div>';
  setApp(html);
}
function buildCustList(list){
  if(!list.length)return'<div class="empty"><div style="font-size:40px;margin-bottom:10px">🌱</div><div style="font-size:15px;font-weight:700;color:#f5f5f4">No customers yet</div></div>';
  return list.map(function(c){
    var cs=samples.filter(function(s){return String(s.customerId)===String(c.ID);});
    var yrs=[...new Set(cs.map(function(s){return s.year;}).filter(Boolean))].sort().join(', ');
    return'<div class="cust-row" onclick="openCust(\''+c.ID+'\')"><div><div class="cust-name">'+esc(c.Name)+'</div><div class="cust-sub">'+(c.Field?esc(c.Field)+' · ':'')+cs.length+' sample'+(cs.length!==1?'s':'')+(yrs?' · '+yrs:'')+'</div></div><span style="color:#57534e;font-size:20px">›</span></div>';
  }).join('');
}
function filterCust(){var q=(document.getElementById('csearch').value||'').toLowerCase();var list=q?customers.filter(function(c){return(c.Name||'').toLowerCase().includes(q)||(c.Field||'').toLowerCase().includes(q);}):customers;document.getElementById('clist').innerHTML=buildCustList(list);}

// ── Customer Detail ──
function openCust(id){
  activeCust=customers.find(function(c){return String(c.ID)===String(id);});if(!activeCust)return;navActive('');
  var c=activeCust;var cs=samples.filter(function(s){return String(s.customerId)===String(c.ID);}).sort(function(a,b){return b.year-a.year;});
  var html='<button class="back no-print" onclick="showPage(\'dash\')">&larr; Back</button>';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:6px"><div class="page-title">'+esc(c.Name)+'</div><div class="btn-row no-print" style="margin:0"><button class="btn-green btn-sm" onclick="startSampleFor(\''+c.ID+'\')">+ Sample</button></div></div>';
  var info=[];if(c.Field)info.push(esc(c.Field));if(c.Address)info.push(esc(c.Address)+(c.City?', '+esc(c.City):''));if(c.Phone)info.push(esc(c.Phone));if(c.Email)info.push(esc(c.Email));
  if(info.length)html+='<div class="page-sub">'+info.join(' · ')+'</div>';
  if(!cs.length){html+='<div class="empty"><div style="font-size:40px;margin-bottom:10px">🧪</div><div style="font-size:15px;font-weight:700;color:#f5f5f4">No samples yet</div><button class="btn-green btn-full no-print" onclick="startSampleFor(\''+c.ID+'\')">+ Add First Sample</button></div>';setApp(html);return;}
  var years=cs.map(function(s){return s.year;});
  html+='<div class="card"><div class="sec-title">Recommendations</div><div class="tbl-wrap"><table><thead><tr><th>Item</th>';years.forEach(function(y){html+='<th class="c">'+y+'</th>';});html+='<th>Notes</th></tr></thead><tbody>';
  RECS.forEach(function(r){html+='<tr><td style="font-family:sans-serif;font-size:13px;font-weight:600;color:#d6d3d1;white-space:nowrap">'+r.label+'</td>';cs.forEach(function(s){var v=s[r.key],none=!v||String(v).toLowerCase()==='none'||v==='0';html+='<td class="c"><span class="badge '+(none?'b-green':'b-orange')+'">'+(v||'None')+'</span></td>';});html+='<td style="color:#57534e;font-size:11px;font-family:sans-serif">'+r.note+'</td></tr>';});
  html+='</tbody></table></div></div>';
  html+='<div class="card"><div class="sec-title">Lab Results — Year over Year</div><div class="tbl-wrap"><table><thead><tr><th>Metric</th>';years.forEach(function(y){html+='<th class="c">'+y+'</th>';});html+='<th>Ideal</th></tr></thead><tbody>';
  SECTIONS.forEach(function(sec){html+='<tr class="sec-row"><td colspan="'+(2+years.length)+'">'+sec+'</td></tr>';METRICS.filter(function(m){return m.sec===sec;}).forEach(function(m){html+='<tr><td><span class="m-lbl" onclick="showInfo(\''+m.key+'\')">'+m.label+'</span></td>';cs.forEach(function(s){html+='<td class="c">'+statusBadge(m,s[m.key])+'</td>';});html+='<td class="ideal">'+(m.info?'info':m.min+'–'+m.max+(m.unit?' '+m.unit:''))+'</td></tr>';});});
  html+='</tbody></table><div class="btn-row no-print" style="margin-top:12px">';cs.forEach(function(s){html+='<button class="btn-danger btn-sm" onclick="doDeleteSample(\''+s.id+'\','+s.year+')">Delete '+s.year+'</button>';});
  html+='</div></div>';
  html+='<button class="btn-outline no-print" onclick="openReport(\''+c.ID+'\')">🖨 Print Report</button>';
  setApp(html);
}

function renderAddPage(){activeCust=null;prefill=null;renderScanStep();}

function renderScanStep(){

function renderSnapCopy(){
  var html='<button class="back" onclick="renderScanStep()">&larr; Back</button><div class="page-title">Snap & Copy</div>'
    +'<div class="card"><div class="sec-title">Step 1 — Take the Photo</div><div style="font-size:14px;color:#a8a29e;font-family:sans-serif;line-height:1.7;margin-bottom:14px">Take a photo of your soil report with your regular camera. Make sure the <b>Laboratory Results</b> table is clear.</div><button class="btn-green btn-full" onclick="document.getElementById(\'cam-input\').click()" style="margin-top:0">📷 Open Camera</button></div>'
    +'<div class="card"><div class="sec-title">Step 2 — Copy the Text</div><div style="font-size:14px;color:#a8a29e;font-family:sans-serif;line-height:1.7">Open the photo. <b>Tap and hold</b> on the text — Live Text will highlight it. Tap <b>Select All</b> then <b>Copy</b>.</div></div>'
    +'<div class="card"><div class="sec-title">Step 3 — Paste & Extract</div><div class="form-group"><label class="form-label">Paste the copied text here</label><textarea class="form-input" id="ocr-text" rows="8" style="min-height:140px;font-size:14px" placeholder="Tap here, then tap Paste..."></textarea></div><button class="btn-green btn-full" onclick="parseOcrText()">🤖 Extract Values</button></div>';
  setApp(html);
}

function renderPasteStep(){
  var html='<button class="back" onclick="renderScanStep()">&larr; Back</button><div class="page-title">Paste Report Text</div>'
    +'<div class="page-sub">Paste the text from your soil report below.</div>'
    +'<div class="card"><div class="form-group"><label class="form-label">Paste soil report text here</label><textarea class="form-input" id="ocr-text" rows="10" style="min-height:160px;font-size:14px" placeholder="Tap here, then tap Paste..."></textarea></div><button class="btn-green btn-full" onclick="parseOcrText()">🤖 Extract Values from Text</button></div>';
  setApp(html);
}

function parseOcrText(){
  var text=(document.getElementById('ocr-text')||{}).value||'';
  if(text.trim().length<20){notify('Paste the report text first.','err');return;}
  setApp('<div class="loading"><div class="spin" style="width:40px;height:40px"></div><p style="margin-top:14px;font-size:17px;font-weight:700;color:#f5f5f4">🤖 Reading Report</p><p style="color:#a8a29e;font-size:14px;margin-top:8px;font-family:sans-serif">3–5 seconds...</p></div>');
  gasGet({action:'getApiKey'}).then(function(r){
    if(!r.success){notify('API key error: '+(r.error||''),'err');renderPasteStep();return;}
    return callAnthropicText(r.key,text);
  }).then(function(result){
    if(!result)return;
    if(result.success&&result.data){
      prefill=result.data;prefill._ai=true;
      if(!activeCust&&prefill.CustomerName){
        var needle=String(prefill.CustomerName).trim().toLowerCase();
        var match=customers.find(function(x){return(x.Name||'').toLowerCase()===needle||(x.Name||'').toLowerCase().includes(needle)||needle.includes((x.Name||'').toLowerCase());});
        if(match)activeCust=match;
      }
      notify('✅ Values extracted!');renderSampleForm(prefill);
    }else{notify('Error: '+(result.error||'Unknown'),'err');renderPasteStep();}
  }).catch(function(e){notify('Error: '+(e.message||e),'err');renderPasteStep();});
}

function callAnthropicText(key,text){
  var prompt='This is OCR text from a Penn State Extension Soil Test Report. Extract values and return ONLY valid JSON:\n'
    +'{"CustomerName":"","Field":"","Year":null,"pH":null,"phosphorus":null,"organicMatter":null,"acidity":null,"potassium":null,"magnesium":null,"calcium":null,"cec":null,"satK":null,"satMg":null,"satCa":null,"limestoneLbs":null,"recN":"","recP":"","recK":""}\n\n'
    +'CustomerName=name after SOIL TEST REPORT FOR. Field=FIELD ID. Year=4-digit from DATE.\n'
    +'pH=1pH from LAB RESULTS. phosphorus=2P lb/A. acidity=3Acidity meq/100g.\n'
    +'potassium=2K meq/100g. magnesium=2Mg meq/100g. calcium=2Ca meq/100g. cec=4CEC.\n'
    +'satK=K% Saturation. satMg=Mg% Saturation. satCa=Ca% Saturation. organicMatter=Organic Matter %.\n'
    +'limestoneLbs=limestone lb/1000ft² or null if NONE. recN/recP/recK=recommendations as printed.\n'
    +'Return ONLY JSON.\n\nREPORT TEXT:\n'+text;
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:512,messages:[{role:'user',content:prompt}]})}).then(function(r){
    if(!r.ok)return r.text().then(function(t){return{success:false,error:'API '+r.status};});
    return r.json().then(function(j){var txt=((j.content||[]).find(function(c){return c.type==='text';})||{}).text||'';var m=txt.match(/\{[\s\S]*\}/);try{return{success:true,data:JSON.parse(m?m[0]:txt)};}catch(e){return{success:false,error:'Parse error'};}});
  });
}

  }

  html+='</select></div>';
  [{k:'recN',l:'Nitrogen (N)'},{k:'recP',l:'Phosphorus (P₂O₅)'},{k:'recK',l:'Potassium (K₂O)'}].forEach(function(r){html+='<div class="form-group"><label class="form-label">'+r.l+'</label><input class="form-input" id="sf-'+r.k+'" value="'+gv(r.k)+'"></div>';});
  html+='</div>';
  SECTIONS.forEach(function(sec){html+='<div class="sub-head">'+sec+'</div><div class="grid-3">';METRICS.filter(function(m){return m.sec===sec;}).forEach(function(m){html+='<div class="form-group"><label class="form-label">'+m.label+(m.unit?' <span style="color:#57534e;font-size:10px">'+m.unit+'</span>':'')+'</label><input class="form-input" id="sf-'+m.key+'" type="number" step="any" value="'+gv(m.key)+'" placeholder="'+m.min+'–'+m.max+'"></div>';});html+='</div>';});
  html+='<button class="btn-green btn-full" onclick="saveSample()">💾 Save to Google Sheets</button></div>';
  setApp(html);

function sfCustChange(v){var w=document.getElementById('sf-newcust-wrap');if(w)w.style.display=v?'none':'';}

function saveSample(){
  var year=parseInt((document.getElementById('sf-year')||{}).value,10);if(!year||year<1990){notify('Enter a valid year.','err');return;}
  function doSave(custId){
    var custName = activeCust ? activeCust.Name : '';
    var data={customerId:custId,customerName:custName,year:year};
    METRICS.forEach(function(m){var raw=((document.getElementById('sf-'+m.key)||{}).value||'').trim();if(raw!=='')data[m.key]=parseFloat(raw);});
    var lime=((document.getElementById('sf-lime')||{}).value||'');if(lime)data.limestoneLbs=lime;
    ['recN','recP','recK'].forEach(function(k){var v=((document.getElementById('sf-'+k)||{}).value||'').trim();if(v)data[k]=v;});
    gasPost({action:'saveSample',data:data}).then(function(r){if(!r.success){notify('Error: '+(r.error||''),'err');return;}data.id=r.id;data.createdAt=new Date().toISOString();samples.push(data);notify('✅ Sample saved!');if(activeCust)openCust(activeCust.ID);else showPage('dash');}).catch(function(err){notify('Error: '+err.message,'err');});
  }
  if(activeCust){doSave(activeCust.ID);return;}
  var selEl=document.getElementById('sf-cust');var selId=selEl?selEl.value:'';
  if(selId){activeCust=customers.find(function(c){return String(c.ID)===String(selId);});doSave(selId);return;}
  var newName=((document.getElementById('sf-newcust')||{}).value||'').trim();if(!newName){notify('Enter a customer name.','err');return;}
  notify('Customer not in master list. Please add them to the master Customer spreadsheet first.','err',6000);
}

function doDeleteCust(id){if(!confirm('Delete this customer and all samples?'))return;gasPost({action:'deleteCustomer',id:id}).then(function(r){if(!r.success){notify('Error','err');return;}customers=customers.filter(function(x){return String(x.ID)!==String(id);});samples=samples.filter(function(s){return String(s.customerId)!==String(id);});notify('Deleted.','inf');showPage('dash');}).catch(function(err){notify('Error','err');});}

  h+='<div style="font-size:11px;font-weight:700;color:#2d5a1b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Recommendations</div><table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:18px"><thead><tr><th style="background:#f0f7ee;padding:6px 8px;text-align:left;color:#2d5a1b;font-weight:600">Item</th>';
  years.forEach(function(y){h+='<th style="background:#f0f7ee;padding:6px 8px;text-align:center;color:#2d5a1b;font-weight:600">'+y+'</th>';});

  h+='</tbody></table>';
  h+='<div style="font-size:11px;font-weight:700;color:#2d5a1b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Soil Test Results</div><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="background:#f0f7ee;padding:6px 8px;text-align:left;color:#2d5a1b;font-weight:600">Metric</th><th style="background:#f0f7ee;padding:6px 8px;text-align:left;color:#2d5a1b;font-weight:600">Ideal</th>';
