<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SoilTracks - Lawns Plants &amp; Pests</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0c0c0c; color: #e7e5e4; font-family: Georgia, serif; min-height: 100vh; font-size: 16px; }

  /* ── Header ── */
  .header { background: #111; border-bottom: 1px solid #292524; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  .logo-text { font-size: 18px; font-weight: 700; color: #f5f5f4; }
  .logo-sub { font-size: 11px; color: #78716c; font-family: monospace; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav-btn { min-height: 44px; padding: 0 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; color: #a8a29e; font-family: sans-serif; white-space: nowrap; }
  .nav-btn.active { background: #4ade8022; color: #4ade80; }
  .nav-btn:hover { background: #1c1c1c; }

  /* ── Layout ── */
  .main { padding: 20px 16px; max-width: 900px; margin: 0 auto; }
  .page-title { font-size: 22px; font-weight: 700; color: #f5f5f4; margin-bottom: 4px; }
  .page-sub { color: #78716c; font-size: 13px; font-family: sans-serif; margin-bottom: 20px; line-height: 1.5; }

  /* ── Cards ── */
  .card { background: #161616; border: 1px solid #222; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .sec-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #57534e; margin-bottom: 14px; font-family: sans-serif; }
  .sub-head { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #4ade8077; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #1f1f1f; font-family: sans-serif; }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: #161616; border: 1px solid #222; border-radius: 12px; padding: 16px; }
  .stat-icon { font-size: 24px; margin-bottom: 6px; }
  .stat-val { font-size: 32px; font-weight: 900; color: #4ade80; font-family: Georgia, serif; }
  .stat-label { font-size: 12px; color: #78716c; font-family: sans-serif; margin-top: 2px; }

  /* ── Buttons ── */
  .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); color: white; border: none; border-radius: 10px; padding: 13px 22px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: sans-serif; min-height: 48px; }
  .btn-green:hover { opacity: 0.9; }
  .btn-green:active { opacity: 0.8; }
  .btn-outline { background: transparent; border: 1px solid #333; border-radius: 8px; color: #a8a29e; padding: 10px 16px; cursor: pointer; font-size: 14px; font-family: sans-serif; min-height: 44px; }
  .btn-outline:hover { border-color: #555; color: #e7e5e4; }
  .btn-danger { background: #7f1d1d33; border: 1px solid #f8717133; border-radius: 8px; color: #f87171; padding: 10px 16px; cursor: pointer; font-size: 14px; font-family: sans-serif; min-height: 44px; }
  .btn-danger:hover { background: #7f1d1d55; }
  .btn-full { width: 100%; margin-top: 10px; padding: 15px 0; font-size: 16px; }
  .btn-sm { padding: 8px 14px; font-size: 13px; min-height: 40px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  /* ── Forms ── */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; color: #a8a29e; margin-bottom: 5px; display: block; font-family: sans-serif; font-weight: 600; }
  .form-input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px 14px; color: #e7e5e4; font-size: 16px; font-family: sans-serif; min-height: 48px; -webkit-appearance: none; }
  .form-input:focus { outline: none; border-color: #4ade8055; }
  select.form-input { cursor: pointer; }
  textarea.form-input { min-height: 80px; resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ── Search & customer list ── */
  .search-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #161616; border: 1px solid #222; border-radius: 12px; margin-bottom: 14px; }
  .search-bar input { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; color: #e7e5e4; font-family: sans-serif; min-height: 28px; }
  .customer-row { padding: 14px 16px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: all 0.15s; min-height: 64px; }
  .customer-row:hover { background: #1a1a1a; border-color: #2a2a2a; }
  .customer-name { font-weight: 700; color: #f5f5f4; font-size: 17px; }
  .customer-sub { font-size: 13px; color: #78716c; font-family: sans-serif; margin-top: 3px; }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; font-family: monospace; }
  .badge-green { background: #4ade8018; color: #4ade80; border: 1px solid #4ade8033; }
  .badge-red { background: #f8717118; color: #f87171; border: 1px solid #f8717133; }
  .badge-orange { background: #fb923c18; color: #fb923c; border: 1px solid #fb923c33; }
  .badge-gray { color: #57534e; }

  /* ── Tables ── */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { padding: 8px 10px; font-weight: 600; border-bottom: 1px solid #222; font-family: sans-serif; font-size: 12px; color: #57534e; text-align: left; white-space: nowrap; }
  th.center { text-align: center; color: #a8a29e; font-family: monospace; font-size: 13px; }
  td { padding: 9px 10px; border-bottom: 1px solid #1a1a1a; }
  td.center { text-align: center; }
  .section-row td { padding: 12px 10px 5px; color: #4ade8077; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-family: sans-serif; border-bottom: 1px solid #1e1e1e; background: #0f0f0f; }
  .metric-label { font-weight: 600; color: #d6d3d1; font-family: sans-serif; font-size: 14px; cursor: pointer; text-decoration: underline dotted #444; }
  .ideal-range { color: #57534e; font-size: 12px; font-family: monospace; white-space: nowrap; }

  /* ── Scan options ── */
  .scan-option { display: flex; align-items: center; gap: 16px; padding: 20px; background: #161616; border: 1px solid #222; border-radius: 14px; cursor: pointer; margin-bottom: 14px; transition: all 0.15s; min-height: 80px; }
  .scan-option:hover { border-color: #4ade8044; background: #1a1a1a; }
  .scan-option.primary { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border-color: #16a34a; }
  .scan-option .icon { font-size: 32px; flex-shrink: 0; }
  .scan-option .title { font-size: 18px; font-weight: 700; margin-bottom: 4px; font-family: sans-serif; }
  .scan-option .desc { font-size: 14px; opacity: 0.75; line-height: 1.4; font-family: sans-serif; }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #1a1a1a; border: 1px solid #333; border-radius: 20px 20px 0 0; padding: 28px 24px; width: 100%; max-width: 540px; max-height: 78vh; overflow-y: auto; }
  .modal h2 { font-size: 20px; font-weight: 700; color: #f5f5f4; margin-bottom: 6px; }
  .modal-range { font-size: 14px; color: #4ade80; margin-bottom: 16px; font-family: monospace; }
  .modal-section { margin-bottom: 16px; }
  .modal-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #4ade80; margin-bottom: 6px; font-family: sans-serif; }
  .modal-body { font-size: 15px; line-height: 1.65; color: #a8a29e; }
  .modal-close { float: right; background: none; border: none; font-size: 28px; cursor: pointer; color: #78716c; min-width: 44px; min-height: 44px; line-height: 1; }

  /* ── Notifications ── */
  .notification { position: fixed; top: 16px; left: 12px; right: 12px; max-width: 500px; margin: 0 auto; border-radius: 10px; padding: 14px 18px; font-size: 15px; font-weight: 600; z-index: 999; box-shadow: 0 8px 32px #00000088; font-family: sans-serif; display: none; }
  .notification.success { background: #14532d; border: 1px solid #4ade80; color: #bbf7d0; }
  .notification.error   { background: #7f1d1d; border: 1px solid #f87171; color: #fca5a5; }
  .notification.info    { background: #1e3a5f; border: 1px solid #60a5fa; color: #bfdbfe; }

  /* ── Loading / Empty ── */
  .loading { text-align: center; padding: 70px 20px; color: #78716c; font-family: sans-serif; }
  .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid #333; border-top-color: #4ade80; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 48px 20px; color: #78716c; font-family: sans-serif; }
  .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; font-weight: 700; color: #f5f5f4; margin-bottom: 6px; }

  /* ── Back button ── */
  .back-btn { display: inline-flex; align-items: center; gap: 6px; color: #78716c; font-family: sans-serif; font-size: 14px; cursor: pointer; margin-bottom: 18px; background: none; border: none; padding: 0; }
  .back-btn:hover { color: #a8a29e; }

  /* ── AI banner ── */
  .ai-ok-banner { background: #0a1f0f; border: 1px solid #4ade8033; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-family: sans-serif; font-size: 13px; color: #4ade80; }
  .ai-warn-banner { background: #1a1200; border: 1px solid #fb923c33; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-family: sans-serif; font-size: 13px; color: #fb923c; }

  /* ── Print / Report ── */
  .report-paper { background: white; color: #1a1a1a; border-radius: 12px; padding: 28px; font-family: sans-serif; }
  .report-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 3px solid #2d5a1b; padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .report-logo { font-size: 20px; font-weight: 900; color: #2d5a1b; line-height: 1.2; }
  .report-customer-name { font-size: 18px; font-weight: 700; color: #2d5a1b; text-align: right; }
  .report-customer-sub { font-size: 12px; color: #666; margin-top: 3px; text-align: right; }
  .report-section-title { font-size: 12px; font-weight: 700; color: #2d5a1b; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 4px; }
  .report-table th { background: #f0f7ee; padding: 7px 10px; text-align: left; color: #2d5a1b; font-weight: 600; }
  .report-table th.center { text-align: center; }
  .report-table td { padding: 7px 10px; border-bottom: 1px solid #eee; }
  .report-table td.center { text-align: center; font-weight: 700; font-family: monospace; }
  .report-table tr:nth-child(even) td { background: #f9f9f9; }
  .report-footer { margin-top: 20px; padding-top: 14px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 11px; color: #999; flex-wrap: wrap; gap: 6px; }

  /* ── Responsive ── */
  @media print {
    .header, .no-print { display: none !important; }
    body { background: white; }
    .main { padding: 0; max-width: none; }
    .report-paper { border-radius: 0; }
  }
  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .nav-btn { padding: 0 8px; font-size: 12px; }
    .logo-sub { display: none; }
    .main { padding: 16px 12px; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>

<div class="notification" id="notification"></div>

<div class="modal-overlay" id="info-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="info-modal-body"></div>
</div>

<input type="file" accept="image/*" id="file-input" style="display:none">
<input type="file" accept="image/*" capture="environment" id="camera-input" style="display:none">

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="38" height="38" rx="8" fill="#1a1208"/>
        <path d="M6 28c2-4 5-3 8-5s4-6 7-5 3 4 6 3 5-3 5-3v10H6z" fill="#3d2b1f"/>
        <path d="M6 30c3-2 5-1 8-3s4-4 7-3 3 3 6 2 5-2 5-2v6H6z" fill="#5c3d2e"/>
        <circle cx="12" cy="24" r="1.2" fill="#78716c" opacity="0.5"/>
        <circle cx="22" cy="26" r="0.8" fill="#78716c" opacity="0.4"/>
        <circle cx="28" cy="25" r="1" fill="#78716c" opacity="0.3"/>
        <path d="M19 8v12" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M19 8c0 0-4 3-5 6" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M19 10c0 0 3 2 4 5" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="14" cy="13" rx="3" ry="4" fill="#4ade80" opacity="0.8" transform="rotate(-20 14 13)"/>
        <ellipse cx="23" cy="14" rx="2.5" ry="3.5" fill="#22c55e" opacity="0.7" transform="rotate(15 23 14)"/>
        <ellipse cx="18" cy="9" rx="2" ry="3" fill="#16a34a" opacity="0.9" transform="rotate(-5 18 9)"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">SoilTracks</div>
      <div class="logo-sub">Lawns Plants &amp; Pests LLC</div>
    </div>
  </div>
  <div class="nav" id="nav">
    <button class="nav-btn active" id="nb-dashboard" onclick="showPage('dashboard')">Dashboard</button>
    <button class="nav-btn" id="nb-add"       onclick="showPage('add')">+ Add</button>
    <button class="nav-btn" id="nb-report"    onclick="showPage('report')">Reports</button>
  </div>
</div>

<div class="main" id="app"></div>

<script>
// ══════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════
var customers = [];
var samples   = [];
var currentPage = 'dashboard';
var activeCustomer = null;
var prefill = null;

// ══════════════════════════════════════════════════════
// Metric definitions
// ══════════════════════════════════════════════════════
var METRICS = [
  { key:'pH',            label:'Soil pH',          unit:'',         optMin:6.0,  optMax:7.0,  section:'Lab Results',
    desc:'Measures soil acidity or alkalinity. Most nutrients are best available between 6.0–7.0.',
    rec:'If too low, apply limestone. If too high, apply elemental sulfur.' },
  { key:'phosphorus',    label:'Phosphorus (P)',    unit:'lb/A',     optMin:50,   optMax:100,  section:'Lab Results',
    desc:'Drives root development and early plant establishment. High P can block zinc and iron uptake.',
    rec:'If deficient, apply phosphate fertilizer. Avoid excess — runoff harms waterways.' },
  { key:'organicMatter', label:'Organic Matter',    unit:'%',        optMin:3,    optMax:6,    section:'Lab Results',
    desc:'Improves water retention, feeds soil biology, and buffers pH swings.',
    rec:'Top-dress with compost, use organic fertilizers, minimize soil disturbance.' },
  { key:'acidity',       label:'Buffer Acidity',    unit:'meq/100g', optMin:0,    optMax:2,    section:'Exchangeable Cations',
    desc:'Reserve acidity in the soil. Higher values mean more limestone is needed to raise pH.',
    rec:'This value determines your limestone application rate.' },
  { key:'potassium',     label:'Potassium (K)',      unit:'meq/100g', optMin:0.15, optMax:0.40, section:'Exchangeable Cations',
    desc:'Essential for water regulation, disease resistance, and winter hardiness.',
    rec:'If deficient, apply potash (K₂O). Important for stress tolerance.' },
  { key:'magnesium',     label:'Magnesium (Mg)',     unit:'meq/100g', optMin:0.5,  optMax:2.5,  section:'Exchangeable Cations',
    desc:'The central atom in every chlorophyll molecule. Plants cannot photosynthesize without it.',
    rec:'If deficient, apply dolomitic limestone or Epsom salt.' },
  { key:'calcium',       label:'Calcium (Ca)',       unit:'meq/100g', optMin:5,    optMax:15,   section:'Exchangeable Cations',
    desc:'Builds strong cell walls and improves soil structure. Primary component of limestone.',
    rec:'If deficient, apply calcitic or dolomitic limestone.' },
  { key:'cec',           label:'CEC',                unit:'meq/100g', optMin:10,   optMax:20,   section:'Exchangeable Cations', infoOnly:true,
    desc:'Cation Exchange Capacity — the soil\'s total ability to hold nutrient ions. Higher CEC means less leaching.',
    rec:'CEC is informational. Improve it long-term by adding organic matter.' },
  { key:'satK',          label:'K Saturation',       unit:'%',        optMin:2,    optMax:5,    section:'% Saturation of CEC',
    desc:'Percentage of CEC occupied by potassium. Too high can block magnesium and calcium uptake.',
    rec:'If too low, apply potassium. If too high relative to Mg, focus on balancing.' },
  { key:'satMg',         label:'Mg Saturation',      unit:'%',        optMin:10,   optMax:20,   section:'% Saturation of CEC',
    desc:'Percentage of CEC occupied by magnesium. Low levels cause chlorophyll deficiency.',
    rec:'If deficient, apply dolomitic limestone or Epsom salt.' },
  { key:'satCa',         label:'Ca Saturation',      unit:'%',        optMin:60,   optMax:80,   section:'% Saturation of CEC',
    desc:'Percentage of CEC occupied by calcium. Low Ca usually signals acidic soil needing lime.',
    rec:'If deficient, apply limestone. Calcium and pH are closely linked.' }
];

var LAB_SECTIONS = ['Lab Results', 'Exchangeable Cations', '% Saturation of CEC'];

var REC_KEYS = [
  { key:'limestoneLbs', label:'Limestone (lb/1000 ft²)', note:'Raises pH. Split if over 100 lb. Aerate first.' },
  { key:'recN',         label:'Nitrogen (N)',              note:'Split into multiple apps through the season.' },
  { key:'recP',         label:'Phosphorus (P₂O₅)',         note:'Only apply what the test recommends.' },
  { key:'recK',         label:'Potassium (K₂O)',            note:'Important for winter hardiness.' }
];

// ══════════════════════════════════════════════════════
// Utilities
// ══════════════════════════════════════════════════════
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtVal(v) {
  if (v === undefined || v === null || v === '') return '<span class="badge-gray">—</span>';
  var n = parseFloat(v);
  return isNaN(n) ? esc(v) : (n % 1 === 0 ? n : n.toFixed(2));
}

function statusBadge(m, val) {
  if (m.infoOnly || val === undefined || val === null || val === '') return fmtVal(val);
  var n = parseFloat(val);
  if (isNaN(n)) return '<span class="badge-gray">—</span>';
  var cls = (n >= m.optMin && n <= m.optMax) ? 'badge-green' : (n > m.optMax ? 'badge-orange' : 'badge-red');
  return '<span class="badge ' + cls + '">' + fmtVal(val) + '</span>';
}

function setApp(html) { document.getElementById('app').innerHTML = html; }

function notify(msg, type, ms) {
  var el = document.getElementById('notification');
  el.textContent = msg;
  el.className = 'notification ' + (type || 'success');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.style.display = 'none'; }, ms || 4000);
}

function navActive(page) {
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  var nb = document.getElementById('nb-' + page);
  if (nb) nb.classList.add('active');
}

// ══════════════════════════════════════════════════════
// Boot — check connection then load data
// ══════════════════════════════════════════════════════
window.onload = function() {
  setApp('<div class="loading"><div class="spinner"></div><p style="margin-top:14px;font-family:sans-serif">Connecting to Google Sheets...</p></div>');

  var timeout = setTimeout(function() {
    setApp('<div class="card" style="background:#1a1000;border-color:#fb923c;margin-top:20px">'
      + '<div style="font-size:16px;font-weight:700;color:#fb923c;margin-bottom:10px;font-family:sans-serif">⚠️ Could not connect</div>'
      + '<p style="font-size:13px;color:#a8a29e;font-family:sans-serif;line-height:1.6;margin-bottom:14px">'
      + 'Check that <b>SPREADSHEET_ID</b> is set in Code.gs and that the script has permission to access the sheet.<br><br>'
      + 'In the Apps Script editor, run <b>testSheetAccess()</b> from the function dropdown to verify.</p>'
      + '<button class="btn-green" onclick="location.reload()">↺ Retry</button></div>');
  }, 12000);

  google.script.run
    .withSuccessHandler(function(r) {
      clearTimeout(timeout);
      if (!r.success) {
        setApp('<div class="card" style="color:#f87171;font-family:sans-serif"><b>Error:</b> ' + esc(r.error) + '</div>');
      } else {
        loadData();
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(timeout);
      setApp('<div class="card" style="color:#f87171;font-family:sans-serif"><b>Script error:</b> ' + esc(err.message || String(err))
        + '<br><button class="btn-green" style="margin-top:12px" onclick="location.reload()">↺ Retry</button></div>');
    })
    .testConnection();

  document.getElementById('file-input').addEventListener('change', function(e) {
    if (e.target.files[0]) handleImage(e.target.files[0]);
    e.target.value = '';
  });

// Image → AI extraction
// ══════════════════════════════════════════════════════
function handleImage(file) {
  if (!file.type.startsWith('image/')) { notify('Please choose an image file.', 'error'); return; }

  var c = activeCustomer;
  var start = Date.now();
  var done = false;

  function elapsed(){ return Math.floor((Date.now() - start) / 1000); }

  setApp(
    '<button class="back-btn" onclick="renderScanStep()">&larr; Back</button>'
    + '<div class="page-title">Scanning Report' + (c ? ' — ' + esc(c.name) : '') + '</div>'
    + '<div class="loading">'
    + '<div class="spinner" style="width:40px;height:40px;border-width:4px"></div>'
    + '<p style="margin-top:16px;font-size:18px;font-weight:700;color:#f5f5f4">🤖 Reading Soil Report</p>'
    + '<p style="color:#78716c;font-size:14px;margin-top:8px;font-family:sans-serif">AI is analyzing your image...</p>'
    + '<p style="color:#3d3d3d;font-size:12px;margin-top:6px;font-family:monospace"><span id="ai-timer">0s</span> elapsed · usually 10–25 sec</p>'
    + '<div style="margin-top:24px"><button class="btn-outline" onclick="skipScan()">✏️ Enter Manually Instead</button></div>'
    + '</div>'
  );

  var tick = setInterval(function(){
    var el = document.getElementById('ai-timer');
    if (el) el.textContent = elapsed() + 's';
  }, 1000);

  window.skipScan = function(){
    if (done) return;
    done = true;
    clearInterval(tick);
    prefill = null;
    renderSampleForm(null);
  };

  function finish(result) {
    if (done) return;
    done = true;
    clearInterval(tick);
    if (result && result.success && result.data) {
      var d = result.data;
      d._aiExtracted = true;
      // Auto-match customer name from report
      if (d.CustomerName) {
        var aiName = d.CustomerName.toLowerCase().trim();
        var match = customers.find(function(x){
          return x.name.toLowerCase().trim() === aiName || x.name.toLowerCase().includes(aiName) || aiName.includes(x.name.toLowerCase());
        });
        if (match && !activeCustomer) activeCustomer = match;
        if (match) d._matchedCustomer = match.name;
      }
      prefill = d;
      notify('✅ Extracted in ' + elapsed() + 's — review below.');
    } else {
      notify('Could not extract: ' + ((result && result.error) || 'unknown') + ' — fill in manually.', 'error', 6000);
      prefill = null;
    }
    renderSampleForm(prefill);
  }

  compressImage(file, 65000, function(b64) {
    // Get the API key from Script Properties, then call Anthropic from the browser
    google.script.run
      .withSuccessHandler(function(keyResult) {
        if (!keyResult || !keyResult.success) {
          finish({ success: false, error: keyResult ? keyResult.error : 'API key not configured.' });
          return;
        }
        callAnthropic(keyResult.key, b64, 'image/jpeg', finish);
      })
      .withFailureHandler(function(err) {
        finish({ success: false, error: err.message || String(err) });
      })
      .getApiKey();
  });
}

function compressImage(file, maxChars, cb) {
  var steps = [
    {size:1800,q:0.85},{size:1600,q:0.78},{size:1400,q:0.70},
    {size:1200,q:0.63},{size:1000,q:0.58},{size:900,q:0.52},{size:800,q:0.46}
  ];
  var canvas = document.createElement('canvas');
  var ctx    = canvas.getContext('2d');
  var img    = new Image();
  var url    = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    var i = 0;
    function next() {
      var s = steps[i] || steps[steps.length - 1];
      var scale = Math.min(1, s.size / Math.max(img.width, img.height));
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var b64 = canvas.toDataURL('image/jpeg', s.q).split(',')[1];
      if (b64.length <= maxChars || i >= steps.length - 1) { cb(b64); }
      else { i++; next(); }
    }
    next();
  };
  img.onerror = function() {
    var reader = new FileReader();
    reader.onload = function(e){ cb(e.target.result.split(',')[1]); };
    reader.readAsDataURL(file);
  };
  img.src = url;
}

var EXTRACT_PROMPT = 'Extract soil test data from this Penn State Extension soil report image. '
  + 'Return ONLY valid JSON with these exact keys (use null for anything not found):\n'
  + '{"CustomerName":"","Field":"","Year":"","pH":null,"phosphorus":null,"organicMatter":null,'
  + '"acidity":null,"potassium":null,"magnesium":null,"calcium":null,"cec":null,'
  + '"satK":null,"satMg":null,"satCa":null,"limestoneLbs":null,"recN":null,"recP":null,"recK":null}\n\n'
  + 'CustomerName = name on SOIL TEST REPORT FOR line.\n'
  + 'Field = FIELD ID value.\nYear = 4-digit year from DATE field.\n'
  + 'pH = soil pH.\nphosphorus = P lb/A.\norganicMatter = Organic Matter %.\n'
  + 'acidity = Buffer Acidity meq/100g.\npotassium = K meq/100g.\nmagnesium = Mg meq/100g.\n'
  + 'calcium = Ca meq/100g.\ncec = CEC meq/100g.\nsatK = K Saturation %.\n'
  + 'satMg = Mg Saturation %.\nsatCa = Ca Saturation %.\n'
  + 'limestoneLbs = limestone rec as number or null.\n'
  + 'recN/recP/recK = fertilizer recs as written or null.\nReturn ONLY the JSON object.';

function callAnthropic(apiKey, b64, mime, cb) {
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      messages: [{
        role: 'user',
        content: [
          { type:'image', source:{ type:'base64', media_type:mime, data:b64 } },
          { type:'text',  text: EXTRACT_PROMPT }
        ]
      }]
    })
  })
  .then(function(r) {
    if (!r.ok) return r.text().then(function(t){ cb({ success:false, error:'API '+r.status+': '+t.substring(0,200) }); });
    return r.json().then(function(j) {
      var txt = ((j.content||[]).find(function(c){ return c.type==='text'; })||{}).text||'';
      var m   = txt.match(/\{[\s\S]*\}/);
      try { cb({ success:true, data:JSON.parse(m ? m[0] : txt) }); }
      catch(e) { cb({ success:false, error:'Parse error: '+e.message }); }
    });
  })
  .catch(function(e){ cb({ success:false, error:e.message||String(e) }); });
}

    + '<select class="form-input" id="sf-limestoneLbs"><option value="">None</option>';
  [25,50,75,100,125,150,175,200,225,250].forEach(function(n){
    html += '<option value="' + n + '"' + (String(gv('limestoneLbs')) === String(n) ? ' selected' : '') + '>' + n + '</option>';
  });
  html += '</select></div>';
  ['recN','recP','recK'].forEach(function(k) {
    var label = k === 'recN' ? 'Nitrogen (N)' : k === 'recP' ? 'Phosphorus (P₂O₅)' : 'Potassium (K₂O)';
    html += '<div class="form-group"><label class="form-label">' + label + '</label>'
      + '<input class="form-input" id="sf-' + k + '" value="' + gv(k) + '" placeholder="—"></div>';
  });
  html += '</div>';

  LAB_SECTIONS.forEach(function(section) {
    html += '<div class="sub-head">' + section + '</div><div class="grid-3">';
    METRICS.filter(function(m){ return m.section === section; }).forEach(function(m) {
      html += '<div class="form-group"><label class="form-label">' + m.label;
      if (m.unit) html += ' <span style="color:#57534e;font-weight:400;font-size:11px">' + m.unit + '</span>';
      html += '</label><input class="form-input" id="sf-' + m.key + '" type="number" step="any" value="' + gv(m.key) + '" placeholder="' + m.optMin + '–' + m.optMax + '"></div>';
    });
    html += '</div>';
  });

  html += '<div class="form-group"><label class="form-label">Notes</label>'
    + '<textarea class="form-input" id="sf-notes" placeholder="Any observations...">' + gv('notes') + '</textarea></div>';

  html += '<button class="btn-green btn-full" onclick="saveSample()">💾 Save to Google Sheets</button>';
  html += '</div>';
  setApp(html);
}

function saveSample() {
  var custId = activeCustomer ? activeCustomer.id : (document.getElementById('sf-customer') || {}).value;
  if (!custId) { notify('Please select a customer.', 'error'); return; }
  var year = parseInt((document.getElementById('sf-year') || {}).value, 10);
  if (!year || year < 1990 || year > 2099) { notify('Enter a valid year (1990–2099).', 'error'); return; }

  var data = { customerId: custId, year: year };
  METRICS.forEach(function(m) {
    var raw = (document.getElementById('sf-' + m.key) || {}).value;
    raw = raw ? raw.trim() : '';
    data[m.key] = raw !== '' ? parseFloat(raw) : undefined;
  });
  var lbs = (document.getElementById('sf-limestoneLbs') || {}).value;
  data.limestoneLbs = lbs || undefined;
  ['recN','recP','recK'].forEach(function(k) {
    var v = (document.getElementById('sf-' + k) || {}).value;
    data[k] = v ? v.trim() : undefined;
  });
  var notes = (document.getElementById('sf-notes') || {}).value;
  data.notes = notes ? notes.trim() : undefined;

  google.script.run
    .withSuccessHandler(function(r) {
      data.id        = r.id;
      data.createdAt = new Date().toISOString();
      samples.push(data);
      prefill = null;
      notify('✅ Sample saved to Google Sheets!');
      if (activeCustomer) { openCustomer(activeCustomer.id); }
      else { showPage('dashboard'); }
    })
    .withFailureHandler(function(err){ notify('Save failed: ' + (err.message || err), 'error'); })
    .saveSample(data);
}

// ══════════════════════════════════════════════════════
// Delete
// ══════════════════════════════════════════════════════
function doDeleteCustomer(id) {
  var c  = customers.find(function(x){ return String(x.id) === String(id); });
  var ct = samples.filter(function(s){ return String(s.customerId) === String(id); }).length;
  if (!confirm('Delete ' + (c ? c.name : 'customer') + ' and all ' + ct + ' sample' + (ct !== 1 ? 's' : '') + '? This cannot be undone.')) return;
  google.script.run
    .withSuccessHandler(function() {
      customers = customers.filter(function(x){ return String(x.id) !== String(id); });
      samples   = samples.filter(function(s){ return String(s.customerId) !== String(id); });
      notify('Customer deleted.');
      showPage('dashboard');
    })
    .withFailureHandler(function(err){ notify('Error: ' + (err.message || err), 'error'); })
    .deleteCustomer(id);
}

function doDeleteSample(id, year) {
  if (!confirm('Delete the ' + year + ' sample? This cannot be undone.')) return;
  var cid = activeCustomer ? activeCustomer.id : null;
  google.script.run
    .withSuccessHandler(function() {
      samples = samples.filter(function(s){ return String(s.id) !== String(id); });
      notify('Sample deleted.');
      if (cid) { openCustomer(cid); } else { showPage('dashboard'); }
    })
    .withFailureHandler(function(err){ notify('Error: ' + (err.message || err), 'error'); })
    .deleteSample(id);
}

// ══════════════════════════════════════════════════════
// Reports
// ══════════════════════════════════════════════════════
function renderReportPage() {
  navActive('report');
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px" class="no-print">'
    + '<div class="page-title">Customer Reports</div>'
    + '<button class="btn-green" onclick="window.print()">🖨️ Print / Save PDF</button></div>';

  html += '<div class="card no-print"><div class="sec-title">Select Customer</div>'
    + '<select class="form-input" id="report-cust" onchange="renderReport()">'
    + '<option value="">— Select a customer —</option>';
  customers.forEach(function(c){ html += '<option value="' + c.id + '">' + esc(c.name) + '</option>'; });
  html += '</select></div><div id="report-out"></div>';
  setApp(html);
}

function openPrintReport(id) {
  showPage('report');
  setTimeout(function(){
    var sel = document.getElementById('report-cust');
    if (sel) { sel.value = id; renderReport(); }
  }, 100);
}

function renderReport() {
  var id  = (document.getElementById('report-cust') || {}).value;
  var out = document.getElementById('report-out');
  if (!out) return;
  if (!id) { out.innerHTML = ''; return; }

  var c  = customers.find(function(x){ return String(x.id) === String(id); });
  var cs = samples.filter(function(s){ return String(s.customerId) === String(id); }).sort(function(a,b){ return a.year - b.year; });
  if (!c || !cs.length) { out.innerHTML = '<div style="color:#78716c;font-family:sans-serif;padding:20px">No samples found.</div>'; return; }

  var years = cs.map(function(s){ return s.year; });
  var today = new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  var html = '<div class="report-paper">'
    + '<div class="report-header">'
    + '<div class="report-logo">LAWNS PLANTS<br>&amp; PESTS LLC<br><span style="font-size:11px;font-weight:400;color:#666">Soil Health Report</span></div>'
    + '<div><div class="report-customer-name">' + esc(c.name) + '</div>'
    + (c.field ? '<div class="report-customer-sub">' + esc(c.field) + '</div>' : '')
    + (c.address ? '<div class="report-customer-sub">' + esc(c.address) + (c.city ? ', ' + esc(c.city) : '') + '</div>' : '')
    + '<div class="report-customer-sub">Generated ' + today + '</div></div></div>';

  // Recs
  html += '<div class="report-section-title">Recommendations</div>'
    + '<table class="report-table"><thead><tr><th>Item</th>';
  years.forEach(function(y){ html += '<th class="center">' + y + '</th>'; });
  html += '</tr></thead><tbody>';
  REC_KEYS.forEach(function(r) {
    html += '<tr><td style="font-weight:600">' + r.label + '</td>';
    cs.forEach(function(s){
      var v = s[r.key];
      var none = !v || String(v).toLowerCase() === 'none' || v === '0';
      html += '<td class="center" style="color:' + (none ? '#16a34a' : '#d97706') + '">' + (v || 'None') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  // Lab results
  html += '<div class="report-section-title">Soil Test Results</div>'
    + '<table class="report-table"><thead><tr><th>Metric</th><th>Ideal Range</th>';
  years.forEach(function(y){ html += '<th class="center">' + y + '</th>'; });
  html += '</tr></thead><tbody>';
  METRICS.forEach(function(m) {
    html += '<tr><td style="font-weight:600">' + m.label + '</td>'
      + '<td style="color:#999;font-family:monospace;font-size:11px">' + (m.infoOnly ? 'info' : m.optMin + '–' + m.optMax + (m.unit ? ' ' + m.unit : '')) + '</td>';
    cs.forEach(function(s) {
      var n = parseFloat(s[m.key]);
      var clr = isNaN(n) ? '#999' : (!m.infoOnly && n >= m.optMin && n <= m.optMax ? '#16a34a' : (!m.infoOnly && n < m.optMin ? '#dc2626' : (!m.infoOnly ? '#d97706' : '#333')));
      html += '<td class="center" style="color:' + clr + '">' + (s[m.key] !== undefined && s[m.key] !== null && s[m.key] !== '' ? s[m.key] : '—') + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';

  html += '<div class="report-footer">'
    + '<span>🟢 Optimal &nbsp; 🟠 Above range &nbsp; 🔴 Below range</span>'
    + '<span style="color:#2d5a1b;font-weight:700">Lawns Plants &amp; Pests LLC</span></div></div>';

  out.innerHTML = html;
}

// ══════════════════════════════════════════════════════
// Metric info modal
// ══════════════════════════════════════════════════════
function showMetricInfo(key) {
  var m = METRICS.find(function(x){ return x.key === key; });
  if (!m) return;
  var html = '<button class="modal-close" onclick="closeModal()">×</button>'
    + '<h2>' + m.label + '</h2>'
    + '<div class="modal-range">' + (m.infoOnly ? 'Informational only' : 'Ideal: ' + m.optMin + ' – ' + m.optMax + (m.unit ? ' ' + m.unit : '')) + '</div>'
    + '<div class="modal-section"><div class="modal-section-title">About</div><div class="modal-body">' + m.desc + '</div></div>'
    + '<div class="modal-section"><div class="modal-section-title">What to do</div><div class="modal-body">' + m.rec + '</div></div>';
  document.getElementById('info-modal-body').innerHTML = html;
  document.getElementById('info-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('info-modal').classList.remove('open');
}
</script>
